name: Cloudflare Validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - src/**
      - tests/e2e/**
      - playwright.config.ts
      - vite.config.ts
      - wrangler.jsonc
      - .github/workflows/cloudflare-deploy.yml
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Typecheck Node surfaces
        run: pnpm run typecheck:node

      - name: End-to-end tests
        run: pnpm run test:e2e

      - name: Build package artifacts
        run: pnpm run build:package

      - name: Package smoke
        run: pnpm run package:smoke

      - name: Build Cloudflare static site
        run: pnpm run build

      - name: Validate Cloudflare Worker bundle
        run: pnpm exec wrangler deploy --dry-run
